name: Bug report
description: Something in FitLens isn't working as it should.
labels: [bug, needs-triage]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Describe the problem. Screenshots or screen recordings help a lot.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the Photos tab
        2. Tap …
        3. …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: input
    id: build
    attributes:
      label: FitLens version
      description: The release you installed, e.g. FitLens 1.0.3.
  - type: input
    id: device
    attributes:
      label: Phone and Android version
      placeholder: e.g. Pixel 8, Android 15
  - type: dropdown
    id: impact
    attributes:
      label: How bad is it?
      options:
        - App crashes or data is lost
        - A feature is broken or unusable
        - Minor or cosmetic
