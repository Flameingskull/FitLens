name: Feature request
description: Suggest a new feature or a change to FitLens.
labels: [enhancement, needs-triage]
body:
  - type: textarea
    id: request
    attributes:
      label: What would you like FitLens to do?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why? What problem does it solve?
  - type: textarea
    id: done
    attributes:
      label: How will you know it's done?
      description: Optional. List what you'd check on your phone to confirm it works.
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - High (next build)
        - Medium
        - Low (nice to have)
